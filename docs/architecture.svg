<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="40" y="45" fill="#f8fafc" font-size="24" font-weight="700">Contract Review Bot — System Architecture</text>
  <text x="40" y="70" fill="#94a3b8" font-size="13">High-Level Data Flow, Ingestion, LangGraph State Orchestration, and Model Integration</text>

  <!-- Layer 1: Client & Presentation -->
  <rect x="40" y="100" width="1020" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="128" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">1. PRESENTATION &amp; SESSION LAYER (STREAMLIT)</text>
  
  <!-- User Box -->
  <rect x="60" y="145" width="160" height="60" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="140" y="172" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">👤 Client User</text>
  <text x="140" y="190" fill="#94a3b8" font-size="11" text-anchor="middle">Upload &amp; Chat</text>

  <!-- Streamlit UI Box -->
  <rect x="260" y="145" width="360" height="60" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="440" y="170" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Streamlit App (app/streamlit_app.py)</text>
  <text x="440" y="188" fill="#94a3b8" font-size="11" text-anchor="middle">Sidebar Stats • Quick Actions • Risk Badges • Report Export</text>

  <!-- Session State Box -->
  <rect x="660" y="145" width="380" height="60" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="850" y="170" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">st.session_state (Session Storage)</text>
  <text x="850" y="188" fill="#94a3b8" font-size="11" text-anchor="middle">In-Memory VectorStore • ChatMemory • Messages</text>

  <!-- Connectors Layer 1 -->
  <line x1="220" y1="175" x2="255" y2="175" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="175" x2="655" y2="175" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: Ingestion & Storage -->
  <rect x="40" y="245" width="1020" height="135" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="272" fill="#10b981" font-size="12" font-weight="700" letter-spacing="1">2. INGESTION &amp; EMBEDDING PIPELINE</text>

  <!-- Document Loader Box -->
  <rect x="60" y="290" width="310" height="75" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="215" y="315" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Document Loader (document_loader.py)</text>
  <text x="215" y="333" fill="#94a3b8" font-size="11" text-anchor="middle">PyPDFLoader / TextLoader</text>
  <text x="215" y="350" fill="#10b981" font-size="10" text-anchor="middle">1-based page metadata • RecursiveTextSplitter (900/150)</text>

  <!-- Embedding Model Box -->
  <rect x="410" y="290" width="310" height="75" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="565" y="315" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Embedding Engine (vectorstore.py)</text>
  <text x="565" y="333" fill="#94a3b8" font-size="11" text-anchor="middle">sentence-transformers/all-MiniLM-L6-v2</text>
  <text x="565" y="350" fill="#10b981" font-size="10" text-anchor="middle">Model-Keyed Cache (_global_embeddings_cache)</text>

  <!-- FAISS Store Box -->
  <rect x="760" y="290" width="280" height="75" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="900" y="315" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">FAISS Vector Store</text>
  <text x="900" y="333" fill="#94a3b8" font-size="11" text-anchor="middle">In-Memory Index (Session Isolated)</text>
  <text x="900" y="350" fill="#10b981" font-size="10" text-anchor="middle">search(query, k=4) • get_all_documents()</text>

  <line x1="370" y1="327" x2="405" y2="327" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="327" x2="755" y2="327" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: LangGraph Orchestration -->
  <rect x="40" y="405" width="1020" height="235" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="432" fill="#fbbf24" font-size="12" font-weight="700" letter-spacing="1">3. STATE-MACHINE ORCHESTRATION (LANGGRAPH)</text>

  <!-- Classifier Node -->
  <rect x="60" y="475" width="180" height="70" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="150" y="502" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">classifier_node</text>
  <text x="150" y="520" fill="#94a3b8" font-size="10" text-anchor="middle">classify_query(query)</text>
  <text x="150" y="534" fill="#fbbf24" font-size="10" text-anchor="middle">IntentOutput Schema</text>

  <!-- Router Diamond-ish Box -->
  <rect x="270" y="482" width="120" height="55" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="330" y="506" fill="#fef3c7" font-size="11" font-weight="700" text-anchor="middle">route_intents()</text>
  <text x="330" y="524" fill="#fde68a" font-size="10" text-anchor="middle">Fan-Out / Fallback</text>

  <line x1="240" y1="510" x2="265" y2="510" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Worker Node 1: RAG -->
  <rect x="430" y="445" width="260" height="48" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="560" y="466" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">rag_node (app/nodes/rag_node.py)</text>
  <text x="560" y="482" fill="#94a3b8" font-size="10" text-anchor="middle">Semantic Search • Grounded Page Citations</text>

  <!-- Worker Node 2: Risk -->
  <rect x="430" y="505" width="260" height="48" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="560" y="526" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">risk_node (app/nodes/risk_node.py)</text>
  <text x="560" y="542" fill="#94a3b8" font-size="10" text-anchor="middle">Multi-Query (utils.py) • Severity: High/Med/Low</text>

  <!-- Worker Node 3: Summary -->
  <rect x="430" y="565" width="260" height="48" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
  <text x="560" y="586" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">summary_node (app/nodes/summary_node.py)</text>
  <text x="560" y="602" fill="#94a3b8" font-size="10" text-anchor="middle">Representative Document Sampling (5 Sections)</text>

  <!-- Branches connecting router to workers -->
  <path d="M 390 500 L 410 470 L 425 470" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <path d="M 390 510 L 425 528" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <path d="M 390 520 L 410 588 L 425 588" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Supervisor Node -->
  <rect x="730" y="480" width="310" height="65" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="885" y="505" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">supervisor_node</text>
  <text x="885" y="523" fill="#94a3b8" font-size="10" text-anchor="middle">Fast-Path Passthrough (1 Node) | Synthesis (&gt;1 Nodes)</text>
  <text x="885" y="537" fill="#38bdf8" font-size="10" text-anchor="middle">Citation Aggregation &amp; Risk Escalation</text>

  <path d="M 690 470 L 710 500 L 725 500" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 690 530 L 725 512" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 690 590 L 710 525 L 725 525" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 4: Foundation Models & External Services -->
  <rect x="40" y="660" width="1020" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="688" fill="#c084fc" font-size="12" font-weight="700" letter-spacing="1">4. FOUNDATION MODELS &amp; EXTERNAL INTEGRATIONS</text>

  <!-- Gemini Model Box -->
  <rect x="60" y="702" width="460" height="52" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
  <text x="290" y="724" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Google Gemini 2.5 Flash API</text>
  <text x="290" y="742" fill="#94a3b8" font-size="11" text-anchor="middle">Structured Outputs (QueryOutput, IntentOutput) via langchain-google-genai</text>

  <!-- External Tooling Box -->
  <rect x="560" y="702" width="480" height="52" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="800" y="724" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">External Legal Search &amp; Compliance (app/tools.py)</text>
  <text x="800" y="742" fill="#64748b" font-size="11" text-anchor="middle">TavilySearchResults • ComplianceChecker (Standalone / Planned Tool Nodes)</text>

  <!-- Connect LLM to LangGraph -->
  <path d="M 290 700 L 290 645" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-purple)"/>

</svg>
